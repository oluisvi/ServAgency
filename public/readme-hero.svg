<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ServAgency — tecnologia, design e estratégia</title>
  <desc id="desc">Banner animado com rotas conectando estratégia, tecnologia, presença digital e evolução.</desc>
  <rect width="1200" height="420" rx="28" fill="#050505"/>
  <path d="M0 336H1200M0 252H1200M0 168H1200M0 84H1200M240 0V420M480 0V420M720 0V420M960 0V420" stroke="#171717"/>
  <path d="M66 326H307C350 326 350 246 393 246H613C656 246 656 326 699 326H1134" stroke="#174AFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M66 326H230C273 326 273 154 316 154H770C813 154 813 92 856 92H1134" stroke="#4B70FF" stroke-width="1.5" stroke-linecap="round" opacity=".55" stroke-dasharray="5 12">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <g fill="#174AFF">
    <circle cx="66" cy="326" r="7"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="393" cy="246" r="7"><animate attributeName="r" values="7;11;7" dur="2s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="699" cy="326" r="7"><animate attributeName="r" values="7;11;7" dur="2s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="1134" cy="326" r="7"><animate attributeName="r" values="7;11;7" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="76" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="3">SERVAGENCY / DIGITAL SYSTEMS</text>
    <text x="64" y="142" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-2">Problemas reais.</text>
    <text x="64" y="205" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-2">Soluções digitais.</text>
    <text x="64" y="364" fill="#A7A7A7" font-size="15" letter-spacing="1.5">DIAGNÓSTICO</text>
    <text x="350" y="284" fill="#A7A7A7" font-size="15" letter-spacing="1.5">ESTRATÉGIA</text>
    <text x="658" y="364" fill="#A7A7A7" font-size="15" letter-spacing="1.5">EXECUÇÃO</text>
    <text x="1028" y="364" fill="#A7A7A7" font-size="15" letter-spacing="1.5">EVOLUÇÃO</text>
  </g>
  <rect x="1008" y="52" width="126" height="38" rx="19" stroke="#333"/>
  <circle cx="1031" cy="71" r="5" fill="#39E58C"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="1045" y="76" fill="#D8D8D8" font-family="Arial, Helvetica, sans-serif" font-size="13">ONLINE</text>
